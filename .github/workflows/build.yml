name: build-module

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download zapret2 (nfqws2 android-arm64 + lua)
        run: |
          curl -fL --retry 3 -o zapret2.tar.gz \
            https://github.com/bol-van/zapret2/releases/download/v1.0.5.2/zapret2-v1.0.5.2.tar.gz
          tar -xzf zapret2.tar.gz
          echo "7b084d0857c373173b4e7f782da93d8dc8c4e22c579fc7675370a2bc7f1d4218  zapret2-v1.0.5.2/binaries/android-arm64/nfqws2" | sha256sum -c -

      - name: Download dnsproxy (linux-arm64)
        run: |
          curl -fL --retry 3 -o dnsproxy.tar.gz \
            https://github.com/AdguardTeam/dnsproxy/releases/download/v0.86.0/dnsproxy-linux-arm64-v0.86.0.tar.gz
          echo "eda840d39da0c2777ea2431d3d73407e813e3fc0e411bfe256a9fb4b97d08247  dnsproxy.tar.gz" | sha256sum -c -
          tar -xzf dnsproxy.tar.gz

      - name: Download CA bundle (Mozilla, curl.se) - dnsproxy DoH icin
        run: |
          curl -fL --retry 3 -o cacert.pem https://curl.se/ca/cacert.pem
          test -s cacert.pem
          grep -q "BEGIN CERTIFICATE" cacert.pem

      - name: Assemble module
        run: |
          MOD=discord_dpi
          test -s module/lists/user-hosts.txt || { echo "module/lists/user-hosts.txt eksik"; exit 1; }
          sed -i 's/\r$//' module/service.sh module/uninstall.sh module/module.prop module/lists/user-hosts.txt

          mkdir -p $MOD/system/bin $MOD/lua $MOD/lists $MOD/blobs
          cp module/module.prop $MOD/
          cp module/service.sh $MOD/
          cp module/uninstall.sh $MOD/
          cp cacert.pem $MOD/cacert.pem
          cp zapret2-v1.0.5.2/binaries/android-arm64/nfqws2 $MOD/system/bin/nfqws2
          cp linux-arm64/dnsproxy $MOD/system/bin/dnsproxy
          cp zapret2-v1.0.5.2/lua/*.lua $MOD/lua/

          # hostlist dosyalari (autohostlist bos baslar, nfqws2 doldurur)
          cp module/lists/user-hosts.txt $MOD/lists/user-hosts.txt
          : > $MOD/lists/autohostlist.txt

          # QUIC sahte paket blob'u (UDP 443 profili icin)
          Q=$(find zapret2-v1.0.5.2 -name 'quic_initial_www_google_com.bin' | head -n1)
          if [ -n "$Q" ]; then
            cp "$Q" $MOD/blobs/quic_initial.bin
          else
            echo "::warning::quic_initial blob bulunamadi, QUIC profili devre disi kalacak"
          fi

          chmod 755 $MOD/system/bin/nfqws2 $MOD/system/bin/dnsproxy $MOD/service.sh $MOD/uninstall.sh
          chmod 644 $MOD/lua/*.lua $MOD/cacert.pem $MOD/lists/user-hosts.txt
          chmod 777 $MOD/lists
          chmod 666 $MOD/lists/autohostlist.txt
          ( cd $MOD && zip -r -X ../discord_dpi_vodafone.zip module.prop service.sh uninstall.sh cacert.pem system lua lists blobs )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord_dpi_vodafone
          path: discord_dpi_vodafone.zip

      - name: Attach to release (sadece tag push'unda)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" discord_dpi_vodafone.zip --generate-notes
